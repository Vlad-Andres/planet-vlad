<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- files in public folder are served as root. Here the favicon is taken from the public folder. -->
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1,maximum-scale=1.0, minimum-scale=1.0">
  <title>My Life Journey</title>
  <style>
    body {
      margin: 0px;
      overflow: hidden;
      position: absolute;
      width: 100%;
      height: 100%;
    }

    #renderCanvas {
      width: 100%;
      height: 100%;
      outline: none; /* Remove outline when focused */
    }

    #app {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none; /* Allow events to pass through to canvas */
      z-index: 10; /* Ensure app is above canvas but below inspector */
    }

    #app > * {
      pointer-events: auto; /* Re-enable pointer events for app children */
    }
    
    /* Ensure Babylon Inspector is visible above all other elements */
    .inspector-container {
      z-index: 1000 !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      pointer-events: auto !important;
    }
    
    /* Fix for Inspector panels visibility */
    #scene-explorer-host {
      left: 0 !important;
      max-width: 100% !important;
      min-width: 300px !important;
      background-color: #333333 !important;
    }
    
    #inspector-host {
      right: 0 !important;
      max-width: 100% !important;
      min-width: 300px !important;
    }
    
    /* Ensure the split bar is visible and draggable */
    #split-bar {
      position: absolute !important;
      width: 5px !important;
      background-color: #555555 !important;
      cursor: col-resize !important;
    }
  </style>
</head>

<body>
  <canvas id="renderCanvas" tabindex="0"></canvas>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
